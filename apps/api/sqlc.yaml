version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/queries/auth_schema.sql"
      - "db/queries/test_helpers.sql"
    queries:
      - "db/queries/auth.sql"
      - "db/queries/test_helpers.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
