version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations/000001_baseline.sql"
    queries:
      - "db/queries/auth.sql"
      - "db/queries/participant.sql"
      - "db/queries/pair.sql"
      - "db/queries/invite.sql"
      - "db/queries/test_helpers.sql"
      - "db/queries/question.sql"
      - "db/queries/together.sql"
      - "db/queries/private.sql"
      - "db/queries/admin_analytics.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
