version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/schema/001_auth.sql"
      - "db/schema/002_participant_pair.sql"
      - "db/schema/003_initial_invite.sql"
      - "db/schema/004_rejoin_invite.sql"
      - "db/schema/005_question_revision.sql"
      - "db/schema/006_together.sql"
      - "db/schema/007_private_round.sql"
      - "db/schema/008_private_round_completed.sql"
      - "db/schema/009_private_post_reveal.sql"
      - "db/schema/010_private_progression.sql"
    queries:
      - "db/queries/auth.sql"
      - "db/queries/participant.sql"
      - "db/queries/pair.sql"
      - "db/queries/invite.sql"
      - "db/queries/test_helpers.sql"
      - "db/queries/question.sql"
      - "db/queries/together.sql"
      - "db/queries/private.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
