# Optional offline/local fallback. Normal development uses the Neon Development branch.
name: Closer

services:
  postgres:
    image: postgres:18
    container_name: Closer-postgres
    environment:
      POSTGRES_DB: Closer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - Closer_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  Closer_postgres_data:
