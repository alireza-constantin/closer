name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: closer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: closer-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d closer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLOSER_TEST_DATABASE_URL: postgres://postgres:closer-test-only@127.0.0.1:5432/closer_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache-dependency-path: apps/api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      - run: bun install --frozen-lockfile

      - name: Initialize empty guarded test database
        run: bun run api:schema:reset:test

      - name: Go checks
        working-directory: apps/api
        run: |
          go fmt ./...
          go vet ./...
          go test -p 1 -count=1 ./...
          go build ./...

      - name: API checks
        run: |
          bun run api:test
          bun run api:build

      - name: SQLC determinism
        run: |
          cd apps/api
          sqlc generate
          git diff --exit-code -- internal/postgres
          sqlc generate
          git diff --exit-code -- internal/postgres

      - name: Vite checks
        run: |
          bun run --filter web-vite test
          bun run --filter web-vite check-types
          bun run --filter web-vite build

      - name: Workspace checks
        run: |
          bun run test
          bun run check-types
          bun run build
