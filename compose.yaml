services:
  closer-test-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: closer_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CLOSER_TEST_POSTGRES_PASSWORD:-closer-test-only}
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d closer_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - closer-test-postgres:/var/lib/postgresql/data

volumes:
  closer-test-postgres:
